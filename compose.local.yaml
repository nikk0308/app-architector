services:
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    image: local/app-architector-api:development
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    volumes:
      - ./storage:/app/storage

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    image: local/app-architector-web:development
